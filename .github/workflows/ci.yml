name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  ledger:
    name: Ledger (rledger check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - name: Installer rustledger
        run: cargo binstall -y rustledger
      - name: Valider le ledger
        run: rledger check examples/ledger/main.beancount

  # Audit des vulnérabilités transitives (advisories RustSec) — on ne clique
  # pas sur `--all-features` (l'AUDIT) ; c'est la ligne de défaut qui clique.
  # Résultat attendu : aucun advisory non ignoré (5 écarts connus sont « non
  # vulnérables » transitoires : 4 non maintenus + 1 retiré).
  cargo-audit:
    name: Cargo audit (advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo audit

  # Dépendance : licenses (GPL only + forbidden), bans (versions multiples),
  # sources (registries git) — full allow list généraliste dans deny.toml.
  # On garde `WHICH` explicite pour ne pas indexer un chemin absente.
  cargo-deny:
    name: Cargo deny (advisories/bans/licenses/sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo deny check --all-features advisories,licenses,bans,sources
